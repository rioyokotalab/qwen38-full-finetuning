[project]
name = "qwen38-full-finetuning"
version = "0.1.0"
description = "Portable multi-node full-parameter fine-tuning for Qwen3.8-27B"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "huggingface-hub==2.4.0",
  "pillow==13.0.0",
  "psutil==7.1.3",
  "safetensors==0.8.0",
  "torch==2.9.1",
  "transformers==5.22.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
